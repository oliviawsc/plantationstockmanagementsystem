# Deploys the Plantation Stock Edge Functions to the Supabase project from
# GitHub, so nobody needs Node.js or the Supabase CLI on their own computer.
# (Stock and Mantap share the same Supabase project.)
#
# One-time setup:
#   1. Supabase → Account (top right) → Access Tokens → Generate new token → copy it
#      (or reuse the token already stored in the Mantap repo)
#   2. GitHub → this repo → Settings → Secrets and variables → Actions →
#      New repository secret: name SUPABASE_ACCESS_TOKEN, value = the token
# Then: Actions tab → "Deploy Supabase functions" → Run workflow.
# It also runs by itself whenever code in supabase/functions changes on main.
name: Deploy Supabase functions

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['supabase/functions/**']

env:
  PROJECT_REF: eukvdlyzhyjohkjqbqjb

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Check the access token is set
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Add the SUPABASE_ACCESS_TOKEN secret first (see the top of this file)."
            exit 1
          fi
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase functions deploy stock-auth --no-verify-jwt --project-ref "$PROJECT_REF" --yes
      - run: supabase functions deploy stock-sso --no-verify-jwt --project-ref "$PROJECT_REF" --yes
